<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chars stream pro | Servicios Digitales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #ffffff; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .bg-panel { background-color: #111827; }
        /* Transición suave para el modal */
        #modal-checkout { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- CABECERA PRINCIPAL -->
    <header class="bg-panel border-b border-gray-800 sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-microchip text-2xl text-purple-500"></i>
                <div class="leading-tight">
                    <h1 class="text-white font-bold text-lg tracking-wide uppercase">Chars stream pro</h1>
                    <p class="text-gray-400 text-[10px] tracking-widest uppercase">Servicios Digitales</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="bg-gray-800/80 border border-gray-700 rounded-full px-3 py-1.5 hidden sm:flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-yellow-400 text-sm"></i>
                    <span class="text-white font-semibold text-sm">Garantía Total</span>
                </div>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow p-4">
        <div class="max-w-7xl mx-auto mt-2">
            
            <!-- Barra de Control VIP -->
            <div class="flex justify-between items-center mb-6 bg-gray-900 border border-gray-800 p-3 rounded-lg">
                <div class="text-gray-400 text-sm font-semibold tracking-widest uppercase">
                    <i class="fa-solid fa-layer-group mr-2"></i>Catálogo
                </div>
                <button onclick="activarModoVIP()" id="btn-vip" class="bg-gray-800 hover:bg-purple-700 border border-gray-700 text-white px-4 py-1.5 rounded transition text-xs font-bold shadow-lg flex items-center gap-2">
                    <i class="fa-solid fa-lock text-gray-400" id="icono-candado"></i> Precios Mayoreo
                </button>
            </div>
            
            <!-- Contenedor de Tarjetas -->
            <div id="grid-catalogo" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- Se inyectan por JS -->
            </div>
        </div>
    </main>

    <!-- MODAL DE CHECKOUT (Oculto por defecto, z-50 para estar por encima de todo) -->
    <div id="modal-checkout" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex justify-center items-center p-4">
        <div class="bg-[#0b0f19] border border-gray-700 rounded-2xl shadow-2xl w-full max-w-md relative overflow-hidden">
            
            <!-- Botón Cerrar -->
            <button onclick="cerrarModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white transition z-10">
                <i class="fa-solid fa-xmark text-2xl"></i>
            </button>

            <!-- Cabecera -->
            <div class="p-6 border-b border-gray-800 bg-[#111827]">
                <h3 class="text-white text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-purple-500"></i> Completar Pedido
                </h3>
                <p class="text-gray-400 text-xs mt-1">Conexión segura con jazander 🤖</p>
            </div>

            <!-- Cuerpo -->
            <div class="p-6">
                <div class="bg-gray-900 rounded-lg p-4 border border-gray-800 mb-5">
                    <p class="text-gray-500 text-[10px] uppercase tracking-widest mb-1">Servicio Seleccionado</p>
                    <p id="modal-nombre-servicio" class="text-white font-semibold text-sm">Cargando...</p>
                    <p id="modal-precio-servicio" class="text-purple-400 font-bold text-2xl mt-1">$0.00</p>
                </div>

                <div class="mb-6">
                    <label class="block text-gray-400 text-xs mb-1 ml-1">Tu Nombre o Alias</label>
                    <input type="text" id="input-nombre" placeholder="Ej. Carlos" class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition">
                </div>

                <button onclick="enviarPedidoJazander()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition shadow-lg shadow-purple-600/30">
                    <i class="fa-brands fa-whatsapp text-xl"></i> Solicitar por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-panel border-t border-gray-800 pt-8 pb-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-500 text-xs">© 2024 - 2026 CHARS STREAM PRO. Todos los derechos reservados.</p>
            <p class="text-gray-600 text-xs mt-1">Arquitectura por Ing. Carlos</p>
        </div>
    </footer>

    <!-- MOTOR JAVASCRIPT -->
    <script>
        // 1. BASE DE DATOS DEL CATÁLOGO
        const catalogoTermux = [
            { id: "OFERTA1", nombre: "ViX + Crunchyroll + Paramount+", precioCliente: 139, precioVIP: 110, logo: "fa-fire", color: "bg-gradient-to-r from-blue-700 to-indigo-900", textColor: "text-white" },
            { id: "S01", nombre: "Netflix Cuenta Completa (5 Perfiles)", precioCliente: 300, precioVIP: 240, logo: "fa-n", color: "bg-black", textColor: "text-red-600" },
            { id: "S05", nombre: "Max Platino (1 mes)", precioCliente: 92, precioVIP: 35, logo: "fa-m", color: "bg-[#002BE7]", textColor: "text-white" },
            { id: "T01", nombre: "RFC con IDCIF (Consulta y descarga)", precioCliente: 49, precioVIP: 35, logo: "fa-file-signature", color: "bg-gray-800", textColor: "text-green-400" },
            { id: "T03", nombre: "Acta oficial de Nacimiento", precioCliente: 150, precioVIP: 99, logo: "fa-file-lines", color: "bg-gray-800", textColor: "text-green-400" }
        ];

        // 2. VARIABLES GLOBALES
        let modoVIPActivo = false;
        let servicioActual = '';
        let precioActual = '';
        const lineaPublica = "525629780972"; 
        const lineaVIP = "525639434114";

        // 3. RENDERIZAR INTERFAZ
        function renderizarCatalogo() {
            const contenedor = document.getElementById('grid-catalogo');
            contenedor.innerHTML = ''; 

            catalogoTermux.forEach(servicio => {
                const precioMXN = modoVIPActivo ? servicio.precioVIP : servicio.precioCliente;
                
                // Nota: Inyectamos dinámicamente el onClick en el botón
                const tarjetaHTML = `
                <div class="bg-gray-900 border ${modoVIPActivo ? 'border-purple-900/50' : 'border-gray-800'} rounded-xl overflow-hidden shadow-lg flex flex-col h-full p-4">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-14 h-14 ${servicio.color} rounded-lg flex items-center justify-center shadow-lg shrink-0">
                            <i class="fa-solid ${servicio.logo} text-2xl ${servicio.textColor}"></i>
                        </div>
                        <div>
                            <p class="text-white font-bold text-sm leading-tight">${servicio.nombre}</p>
                            <div class="flex gap-2 mt-1">
                                <span class="bg-green-900/30 text-green-500 text-[9px] px-2 py-0.5 rounded border border-green-800">GARANTÍA</span>
                                <span class="bg-blue-900/30 text-blue-500 text-[9px] px-2 py-0.5 rounded border border-blue-800">RENOVABLE</span>
                            </div>
                        </div>
                    </div>
                    <div class="mt-auto">
                        <h3 class="text-purple-400 text-2xl font-bold mb-3">$${precioMXN.toFixed(2)} MXN</h3>
                        <button onclick="abrirModalCompra('${servicio.nombre}', '$${precioMXN.toFixed(2)} MXN')" class="w-full bg-gray-800 hover:bg-purple-600 border border-gray-700 text-white font-semibold py-2.5 rounded-lg transition text-xs tracking-wider">
                            Activar / Comprar
                        </button>
                    </div>
                </div>`;
                contenedor.innerHTML += tarjetaHTML;
            });
        }

        // 4. LÓGICA VIP
        function activarModoVIP() {
            if (modoVIPActivo) {
                modoVIPActivo = false;
                document.getElementById('btn-vip').classList.replace('bg-purple-700', 'bg-gray-800');
                document.getElementById('icono-candado').classList.replace('fa-unlock', 'fa-lock');
                document.getElementById('icono-candado').classList.replace('text-white', 'text-gray-400');
                renderizarCatalogo();
                return;
            }

            const pinIngresado = prompt("🔒 INGRESO RESTRINGIDO:\\nIngrese el PIN de distribuidor:");
            if (pinIngresado === "102350") {
                modoVIPActivo = true;
                alert("✅ PIN Correcto. Tarifas de Mayoreo Activadas.");
                document.getElementById('btn-vip').classList.replace('bg-gray-800', 'bg-purple-700');
                document.getElementById('icono-candado').classList.replace('fa-lock', 'fa-unlock');
                document.getElementById('icono-candado').classList.replace('text-gray-400', 'text-white');
                renderizarCatalogo(); 
            } else if (pinIngresado !== null) {
                alert("❌ PIN Incorrecto.");
            }
        }

        // 5. LÓGICA DEL MODAL Y WHATSAPP
        function abrirModalCompra(nombre, precio) {
            servicioActual = nombre;
            precioActual = precio;
            document.getElementById('modal-nombre-servicio').innerText = nombre;
            document.getElementById('modal-precio-servicio').innerText = precio;
            
            // Mostrar modal
            const modal = document.getElementById('modal-checkout');
            modal.classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modal-checkout').classList.add('hidden');
        }

        function enviarPedidoJazander() {
            let nombreCliente = document.getElementById('input-nombre').value.trim();
            if (!nombreCliente) nombreCliente = "Cliente web";

            // Enrutamiento Automático
            const numeroDestino = modoVIPActivo ? lineaVIP : lineaPublica;

            const mensaje = `🤖 *NUEVO PEDIDO WEB*\n\nHola jazander, soy ${nombreCliente}. Deseo adquirir:\n\n📌 *Servicio:* ${servicioActual}\n💰 *Costo:* ${precioActual}\n\n¿Me proporcionas los métodos de pago?`;
            const urlWhatsApp = `https://wa.me/${numeroDestino}?text=${encodeURIComponent(mensaje)}`;
            
            window.open(urlWhatsApp, '_blank');
            cerrarModal();
        }

        // INICIAR
        window.onload = renderizarCatalogo;
    </script>
</body>
</html>
