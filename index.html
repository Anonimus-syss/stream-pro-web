<style>

  .search-container { max-width: 800px; margin: 0 auto 1.5rem; padding: 0 1rem; }
  .search-bar { width: 100%; padding: 12px 20px; border-radius: 30px; border: 1px solid #2d3748; background: #1e293b; color: white; font-family: 'Poppins', sans-serif; font-size: 1rem; box-sizing: border-box; outline: none; transition: border-color 0.3s, box-shadow 0.3s; }
  .search-bar:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(168, 85, 247, 0.3); }
  .container { max-width: 800px; margin: 0 auto; padding: 0 1rem; }
  .category { background: var(--card); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 8px 16px rgba(0,0,0,0.2); transition: transform 0.3s; }
  .category h2 { margin-top: 0; border-bottom: 2px solid #2d3748; padding-bottom: 0.8rem; color: #fff; font-size: 1.25rem; font-weight: 600; }
  .item { padding: 1rem; border-radius: 8px; margin-bottom: 0.5rem; display: flex; flex-direction: column; gap: 0.3rem; transition: background 0.2s; border: 1px solid transparent; }
  .item:hover { background: #1e293b; border-color: #2d3748; }
  .item-title { font-weight: 600; font-size: 1.05rem; color: #f8fafc; }
  .item-price { color: var(--accent); font-size: 0.95rem; font-weight: 600; }
  .fab { position: fixed; bottom: 20px; right: 20px; background: #25D366; color: white; border-radius: 50px; padding: 14px 24px; text-decoration: none; font-weight: 600; display: flex; align-items: center; box-shadow: 0 6px 15px rgba(37, 211, 102, 0.4); z-index: 1000; transition: transform 0.2s, background 0.2s; }

  footer { text-align: center; padding: 2rem 1rem; color: #64748b; font-size: 0.85rem; border-top: 1px solid #1e293b; margin-top: 2rem; }
  .no-results { text-align: center; color: #94a3b8; padding: 2rem; display: none; }
</style>
</head>

    ];

    function renderCatalog(filterText = "") {
      let html = "";
      let hasResults = false;
      const term = filterText.toLowerCase();

      data.forEach(cat => {
        let filteredItems = cat.i.filter(item => item.toLowerCase().includes(term));
        
        if (filteredItems.length > 0) {
          hasResults = true;
          html += `<div class="category"><h2>${cat.c}</h2>`;
          filteredItems.forEach(item => {
            let p = item.split('|');
            html += `<div class="item"><div class="item-title">${p[0]}</div><div class="item-price">${p[1]}</div></div>`;
          });
          html += `</div>`;
        }
      });

      document.getElementById('catalog').innerHTML = html;
      document.getElementById('noResults').style.display = hasResults ? 'none' : 'block';
    }

    function filterServices() {
      const input = document.getElementById('searchInput').value;
      renderCatalog(input);
    }

    // Render inicial
    renderCatalog();
  </script>
</body>
</html>
